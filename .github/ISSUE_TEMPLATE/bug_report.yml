name: Bug report
description: Report a reproducible problem in an implementation or repository workflow.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, do not use this public form. See SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, version, transport backend, and relevant configuration (remove secrets).
    validations:
      required: false
