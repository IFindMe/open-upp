name: Feature or design proposal
description: Propose a capability or protocol design change.
title: "[Proposal]: "
labels: ["proposal", "needs-discussion"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
    validations:
      required: false
  - type: textarea
    id: security
    attributes:
      label: Security, privacy, and abuse considerations
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration
    validations:
      required: false
